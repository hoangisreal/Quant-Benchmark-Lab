name: Python correctness
on: [push, pull_request]
jobs:
  correctness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0, Node 24
        with:
          version: '0.12.17'
          python-version: '3.11'
      - name: Check committed dependency lock
        run: |
          test -f uv.lock
          uv lock --check
          uv sync --frozen --python 3.11 --group dev
      - name: Lint and test
        run: |
          uv run --frozen ruff check .
          uv run --frozen python -m unittest discover -s tests -v
      - name: CLI campaign demonstration
        run: |
          uv run --frozen qbl plan --config configs/demo.yaml --output /tmp/schedule.json
          uv run --frozen qbl run --schedule /tmp/schedule.json --campaign /tmp/campaign
          uv run --frozen qbl evaluate --campaign /tmp/campaign
          uv run --frozen qbl report --campaign /tmp/campaign --output /tmp/report
          uv run --frozen qbl audit --campaign /tmp/campaign
          uv run --frozen qbl run --schedule /tmp/schedule.json --campaign /tmp/campaign --resume
          uv run --frozen qbl audit --campaign /tmp/campaign
